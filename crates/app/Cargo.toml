[package]
name = "agt"
description = "AGT (Actually Good Transcription): local hold-to-talk dictation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "agt"
path = "src/main.rs"

[dependencies]
agt-core.workspace = true
agt-audio.workspace = true
agt-platform.workspace = true
agt-stt.workspace = true
agt-polish.workspace = true
agt-overlay.workspace = true
agt-telemetry.workspace = true
agt-history.workspace = true
agt-settings-ui.workspace = true
agt-meeting.workspace = true
serde.workspace = true
serde_json = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std", "tracing-log"] }
tracing-log = { version = "0.2", default-features = false }
tray-icon = "0.26"
velopack = "1.2"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# The meeting notes window and the side pill (WKWebView / WebView2): real text editing.
wry = { version = "0.57", default-features = false }

# `agt stats` attaches to the console it was started from (release builds have none); the
# settings window may take the foreground. The meeting pill: cursor and mouse button polling,
# shown without activating.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Whether the app bundle is writable (see `update::silent`); reopening the tray menu after
# "Check for updates" (see `tray::Tray::reopen_menu`). The meeting pill: a non-activating
# panel, cursor and mouse button polling; the Edit menu the notes window's shortcuts need.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "CFRunLoop"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSString",
    "objc2-core-foundation",
] }

[features]
# Optional STT engines/backends; see agt-stt's Cargo.toml and docs/benchmarks.md.
cuda = ["agt-stt/cuda"]
whisper = ["agt-stt/whisper"]
whisper-vulkan = ["agt-stt/whisper-vulkan"]
whisper-metal = ["agt-stt/whisper-metal"]
